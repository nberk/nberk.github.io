{{ define "main" }}
<h1>{{ .Title }}</h1>

<div class="blog-tags">
  {{ range .Site.Taxonomies.tags }}
    <a href="{{ .Page.RelPermalink }}" class="tag-badge">{{ .Page.Title }}</a>
  {{ end }}
</div>

<ul class="post-list">
  {{ range .Pages.ByDate.Reverse }}
    <li class="post-item">
      <a class="post-item-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
      <div class="post-item-meta">
        <span class="post-date">{{ .Date.Format "January 2, 2006" }}</span>
        {{ range .Params.tags }}
          <span class="tag-badge">{{ . }}</span>
        {{ end }}
      </div>
    </li>
  {{ end }}
</ul>
{{ end }}
